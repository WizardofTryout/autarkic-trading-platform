[tool.poetry]
name = "trading-agent-strategy-engine"
version = "0.1.0"
description = "Strategy Engine for Autarkic AI-Driven Crypto Trading Ecosystem"
authors = ["Autarkic Trading Agent"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
pandas = "^2.2.0"
redis = "^5.0.1"
pydantic = "^2.6.0"
pydantic-settings = "^2.1.0"
httpx = "^0.26.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
black = "^24.1.0"
isort = "^5.13.0"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
