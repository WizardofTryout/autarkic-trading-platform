[tool.poetry]
name = "trading-agent-backend"
version = "0.1.0"
description = "Backend for Autarkic AI-Driven Crypto Trading Ecosystem"
authors = ["Autarkic Trading Agent"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
sqlalchemy = "^2.0.25"
asyncpg = "^0.29.0"
alembic = "^1.13.1"
pydantic = "^2.6.0"
pydantic-settings = "^2.1.0"
ccxt = "^4.2.19"
cryptography = "^42.0.0"
argon2-cffi = "^23.1.0"
python-multipart = "^0.0.9"
httpx = "^0.26.0"
pandas = "^2.2.0"
numpy = "^1.26.0"
websockets = "^12.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
email-validator = "^2.3.0"
google-generativeai = "^0.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
black = "^24.1.0"
isort = "^5.13.0"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
